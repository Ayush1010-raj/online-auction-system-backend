spring.application.name=api-gateway
server.port=8091

eureka.instance.prefer-ip-address=true
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webflux.routes[0].id=transaction-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://transaction-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/transactions/**

spring.cloud.gateway.server.webflux.routes[1].id=review-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://review-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/reviews/**

spring.cloud.gateway.server.webflux.routes[2].id=user-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/auth/**,/api/users/**

spring.cloud.gateway.server.webflux.routes[3].id=bidding-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://bidding-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/bids/**

spring.cloud.gateway.server.webflux.routes[4].id=auction-product-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://auction-product-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/auctions/**,/api/products/**,/api/images/**

jwt.secret=${JWT_SECRET}
